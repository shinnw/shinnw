<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150F2E"/>
      <stop offset="55%" stop-color="#2E1F5E"/>
      <stop offset="100%" stop-color="#6B2E8C"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1533"/>
      <stop offset="100%" stop-color="#120C24"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8FE3"/>
      <stop offset="100%" stop-color="#B79CFF"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6EC7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FF6EC7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA6EA"/>
      <stop offset="100%" stop-color="#E85AC4"/>
    </linearGradient>
    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FE3F5"/>
      <stop offset="100%" stop-color="#5EC8E8"/>
    </linearGradient>
    <linearGradient id="orbGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C79CFF"/>
      <stop offset="100%" stop-color="#9B6BD6"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blurText" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="0" y="0" width="780" height="220" rx="18"/>
    </clipPath>
  </defs>

  <!-- base panel -->
  <g clip-path="url(#panelClip)">
    <rect x="0" y="0" width="780" height="220" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="780" height="220" fill="url(#dots)" opacity="0.05"/>

    <!-- ambient glows -->
    <circle cx="60" cy="20" r="110" fill="url(#glowCyan)" filter="url(#blurSoft)"/>
    <circle cx="700" cy="190" r="160" fill="url(#glowPink)" filter="url(#blurSoft)"/>

    <!-- faint hex flavor -->
    <text x="330" y="24" font-family="Consolas, Menlo, monospace" font-size="10" fill="#C9BFFF" opacity="0.18">0x1F  01101000  flag{}</text>

    <!-- terminal card -->
    <rect x="26" y="34" width="216" height="152" rx="12" fill="url(#termGrad)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="26" y="34" width="216" height="24" rx="12" fill="#FFFFFF" opacity="0.04"/>
    <circle cx="42" cy="46" r="4" fill="#FF8FE3"/>
    <circle cx="56" cy="46" r="4" fill="#8FE3F5"/>
    <circle cx="70" cy="46" r="4" fill="#C79CFF"/>

    <text x="40" y="82" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5EEAD4">$ whoami</text>
    <text x="40" y="100" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FF8FE3">&gt; shina_shuraina</text>
    <text x="40" y="122" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5EEAD4">$ cat skills.txt</text>
    <text x="40" y="140" font-family="Consolas, Menlo, monospace" font-size="12" fill="#E9E4FF">js &#183; python &#183; linux</text>
    <text x="40" y="158" font-family="Consolas, Menlo, monospace" font-size="12" fill="#E9E4FF">ctf &#183; en (learning)</text>
    <rect x="40" y="164" width="8" height="12" fill="#FF8FE3">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- name with glow -->
    <text x="268" y="98" font-family="Verdana, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#textGrad)" filter="url(#blurText)" opacity="0.55">Shina Shuraina</text>
    <text x="268" y="98" font-family="Verdana, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#textGrad)">Shina Shuraina</text>

    <text x="270" y="124" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#C9BFFF" opacity="0.9">Full-stack tinkerer &#183; CTF player &#183; Linux enthusiast</text>

    <!-- chips -->
    <g font-family="Verdana, Arial, sans-serif" font-size="11" fill="#E9E4FF">
      <rect x="270" y="140" width="84" height="24" rx="12" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="284" y="156">JavaScript</text>

      <rect x="362" y="140" width="60" height="24" rx="12" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="376" y="156">Python</text>

      <rect x="430" y="140" width="58" height="24" rx="12" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="444" y="156">Linux</text>

      <rect x="496" y="140" width="52" height="24" rx="12" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="510" y="156">CTF</text>
    </g>

    <!-- network graphic, right side -->
    <g stroke="#C9BFFF" stroke-opacity="0.25" stroke-width="1">
      <line x1="600" y1="60" x2="655" y2="40"/>
      <line x1="655" y1="40" x2="712" y2="70"/>
      <line x1="600" y1="60" x2="640" y2="110"/>
      <line x1="640" y1="110" x2="712" y2="70"/>
      <line x1="640" y1="110" x2="618" y2="160"/>
      <line x1="640" y1="110" x2="700" y2="150"/>
      <line x1="700" y1="150" x2="712" y2="70"/>
      <line x1="618" y1="160" x2="672" y2="188"/>
      <line x1="700" y1="150" x2="672" y2="188"/>
    </g>
    <circle cx="600" cy="60" r="4" fill="#8FE3F5"/>
    <circle cx="655" cy="40" r="3" fill="#E9E4FF"/>
    <circle cx="618" cy="160" r="3" fill="#E9E4FF"/>

    <circle cx="712" cy="70" r="20" fill="url(#orbGrad1)"/>
    <circle cx="640" cy="110" r="15" fill="url(#orbGrad2)"/>
    <circle cx="700" cy="150" r="17" fill="url(#orbGrad3)"/>
    <circle cx="672" cy="188" r="11" fill="url(#orbGrad1)"/>
  </g>

  <!-- outer glow border -->
  <rect x="1.5" y="1.5" width="777" height="217" rx="18" fill="none" stroke="url(#textGrad)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
